name: Compile & Package Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Compile & Package Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Force-Generate Clean Gradle Wrapper
        run: |
          # Destroy any lingering corrupted files from previous checkouts
          rm -rf gradle/ gradlew gradlew.bat
          
          # Force the cloud server to generate a pristine, uncorrupted binary engine
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Decode and Reconstruct Keystore File
        run: |
          mkdir -p app
          echo "${{ secrets.SIGNING_KEY_BASE64 }}" | base64 --decode -i > app/madhu-release.jks

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Zipalign and Sign APK Natively
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_SDK_ROOT/build-tools/* | sort -V | tail -n 1)
          echo "Using Build Tools from: $BUILD_TOOLS"
          
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*-unsigned.apk" | head -n 1)
          ALIGNED_APK="${UNSIGNED_APK/-unsigned/-aligned}"
          SIGNED_APK="${UNSIGNED_APK/-unsigned/-signed}"
          
          echo "Aligning APK..."
          $BUILD_TOOLS/zipalign -v -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          
          echo "Signing APK..."
          $BUILD_TOOLS/apksigner sign \
            --ks app/madhu-release.jks \
            --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --key-pass pass:"$RELEASE_KEY_PASSWORD" \
            --out "$SIGNED_APK" "$ALIGNED_APK"
            
          echo "SIGNED_APK_PATH=$SIGNED_APK" >> $GITHUB_ENV

      - name: Upload Signed Production Build
        uses: actions/upload-artifact@v4
        with:
          name: Madhu-Release-Signed-APK
          path: ${{ env.SIGNED_APK_PATH }}
          if-no-files-found: error
          retention-days: 7
