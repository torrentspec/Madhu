name: Compile & Package Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Compile & Package Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Force-Generate Clean Gradle Wrapper
        run: |
          rm -rf gradle/ gradlew gradlew.bat
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Generate Keystore Natively
        run: |
          mkdir -p app
          # The server creates the Keystore directly, bypassing GitHub Secrets
          keytool -genkeypair -v \
            -keystore app/madhu-release.jks \
            -alias madhu-alias \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass madhupass \
            -keypass madhupass \
            -dname "CN=Madhu App, OU=Android, O=Madhu, C=US"

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Zipalign and Sign APK
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_SDK_ROOT/build-tools/* | sort -V | tail -n 1)
          echo "Using Build Tools from: $BUILD_TOOLS"
          
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*-unsigned.apk" | head -n 1)
          ALIGNED_APK="${UNSIGNED_APK/-unsigned/-aligned}"
          SIGNED_APK="${UNSIGNED_APK/-unsigned/-signed}"
          
          echo "Aligning APK..."
          $BUILD_TOOLS/zipalign -v -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          
          echo "Signing APK..."
          $BUILD_TOOLS/apksigner sign \
            --ks app/madhu-release.jks \
            --ks-key-alias "madhu-alias" \
            --ks-pass pass:"madhupass" \
            --key-pass pass:"madhupass" \
            --out "$SIGNED_APK" "$ALIGNED_APK"
            
          echo "SIGNED_APK_PATH=$SIGNED_APK" >> $GITHUB_ENV

      - name: Upload Signed APK and Keystore
        uses: actions/upload-artifact@v4
        with:
          name: Madhu-Release-Artifacts
          path: |
            ${{ env.SIGNED_APK_PATH }}
            app/madhu-release.jks
          if-no-files-found: error
          retention-days: 7
